<form id="contactform" onsubmit="return validateForm();">

 <section class="card">

           <div class="container">


        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Your full name...">
        <span id="fullname-error" class="error"></span>

        <label for="lname">Email</label>
        <input type="text" id="email" placeholder="Your email...">
        <span id="email-error" class="error"></span>

        <label for="subject">Subject</label>
        <input type="text" id="subject">
        <span id="subject-error" class="error"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write message..." style="height:200px"></textarea>
        <span id="message-error" class="error"></span>
    
        <input type="submit" value="Submit">
